<!DOCTYPE html>
<html>
<head>
    <title>Pitch Detector</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            padding: 50px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }
        .container {
            background: rgba(255, 255, 255, 0.1);
            padding: 40px;
            border-radius: 20px;
            backdrop-filter: blur(10px);
            max-width: 500px;
            margin: 0 auto;
        }
        .note {
            font-size: 72px;
            margin: 20px 0;
        }
        .frequency {
            font-size: 24px;
            opacity: 0.8;
        }
        .confidence {
            font-size: 18px;
            opacity: 0.6;
        }
        button {
            background: white;
            border: none;
            padding: 15px 40px;
            font-size: 18px;
            border-radius: 30px;
            cursor: pointer;
            color: #764ba2;
            font-weight: bold;
            transition: transform 0.2s;
        }
        button:hover {
            transform: scale(1.05);
        }
        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        .status {
            margin-top: 20px;
            opacity: 0.8;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🎵 Pitch Detector</h1>
        <div class="note" id="note">-</div>
        <div class="frequency" id="frequency">0 Hz</div>
        <div class="confidence" id="confidence">Confidence: 0%</div>
        <button id="toggleBtn">Start Listening</button>
        <div class="status" id="status">Click to start</div>
    </div>
    <script type="module" src="app.js"></script>
</body>
</html>
