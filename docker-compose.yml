services:
  frontend:
    image: nginx:alpine
    ports:
      - "8000:80"
    volumes:
      - ./:/usr/share/nginx/html:ro
      - ./conf/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - audiforge
  
  audiforge:
    image: nirmata1/audiforge:latest
    container_name: audiforge
    platform: linux/amd64
    ports:
      - "8080:8080" # para debuggear