server {
	listen 80;
	server_name localhost;

	absolute_redirect off;

	root /usr/share/nginx/html;
	index index.html;

	client_max_body_size 50M;

	# Main frontend
	location / {
		try_files $uri $uri/ =404;
	}

	# WASM files
	location ~ \.wasm$ {
		add_header Content-Type application/wasm;
		try_files $uri =404;
	}

	# Audiforge API
	location /api/ {
		proxy_pass http://audiforge:8080/;

		proxy_http_version 1.1;
		proxy_read_timeout 10m;
		proxy_send_timeout 10m;
	}

	# Testing frontend
	location = /test {
		return 301 /test/; # Redirect
	}

	location ^~ /test/ {
		alias /usr/share/nginx/testing/;
		index index.html
		try_files $uri $uri/ =404;
	}
}