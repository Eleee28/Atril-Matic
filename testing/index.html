<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="UTF-8">
		<meta name="viewport" content="width=device-width, initial-scale=1.0">

		<title>Atril-Matic | Testing</title>

		<link rel="stylesheet" href="./css/styles.css">

		<script type="module" src="./js/main.js"></script>
	</head>

	<body>
		<div class="app">
			<header class="app-header">
				<div>
					<h1>Atril-Matic Testing</h1>
					<p>Audio recognition testing and debugging tool</p>
				</div>
			</header>

			<main class="app-content">

				<section class="panel configuration-panel">
					<h2>Configuration</h2>

					<form id="configuration-form">
						<div
							id="configuration-errors"
							class="configuration-errors"
							role="alert"
							aria-live="polite"
							hidden
						></div>
						
						<fieldset>
							<legend>FFT Configuration</legend>

							<div class="form-grid">
								<label for="sample-rate">Sample Rate (Hz)</label>
								<select id="sample-rate" name="sampleRate">
									<option value="8000">8000</option>
									<option value="16000">16000</option>
									<option value="22050">22050</option>
									<option value="44100">44100</option>
									<option value="48000">48000</option>
								</select>

								<label for="fft-size">FFT Size</label>
								<select id="fft-size" name="fftSize">
									<option value="512">512</option>
									<option value="1024">1024</option>
									<option value="2048">2048</option>
									<option value="4096">4096</option>
									<option value="8192">8192</option>
									<option value="16348">16348</option>
								</select>

								<label for="window-size">Window Size</label>
								<select id="window-size" name="windowSize">
									<option value="512">512</option>
									<option value="1024">1024</option>
									<option value="2048">2048</option>
									<option value="4096">4096</option>
									<option value="8192">8192</option>
								</select>

								<label for="hop-size">Hop Size</label>
								<select id="hop-size" name="hopSize">
									<option value="128">128</option>
									<option value="256">256</option>
									<option value="512">512</option>
									<option value="1024">1024</option>
									<option value="2048">2048</option>
								</select>

								<label for="window-function">Window Function</label>
								<select id="window-function" name="windowFunction">
									<option value="rectangular">Rectangular</option>
									<option value="hann">Hann</option>
									<option value="hamming">Hamming</option>
									<option value="blackman">Blackman</option>
								</select>
							</div>
						</fieldset>

						<fieldset>
							<legend>Pitch Detection</legend>

							<div class="form-grid">
								<label for="pitch-algorithm">Pitch Algorithm</label>
								<select id="pitch-algorithm" name="pitchAlgorithm">
									<option value="fft-peak">FFT Peak</option>
									<option value="fft-harmonics">FFT Harmonics</option>
									<option value="hps">Harmonic Product Spectrum</option>
									<option value="yin">YIN</option>
								</select>

								<label for="min-frequency">Minimum Frequency (Hz)</label>
								<input 
									type="number"
									id="min-frequency"
									name="minFrequency"
									value="60"
									min="0"
									step="1"
								>

								<label for="max-frequency">Maximum Frequency (Hz)</label>
								<input 
									type="number"
									id="max-frequency"
									name="maxFrequency"
									value="2000"
									min="1"
									step="1"
								>

								<label for="magnitude-threshold">Magnitude Threshold</label>
								<input 
									type="number"
									id="magnitude-threshold"
									name="magnitudeThreshold"
									value="10"
									min="0"
									step="0.1"
								>

								<label for="max-harmonic-divisor">Maximum Harmonic Divisor</label>
								<input 
									type="number"
									id="max-harmonic-divisor"
									name="maxHarmonicDivisor"
									value="4"
									min="1"
									step="1"
								>

								<label for="subharmonic-threshold">Subharmonic Threshold</label>
								<input 
									type="number"
									id="subharmonic-threshold"
									name="subharmonicThreshold"
									value="0.5"
									min="0"
									step="0.1"
								>
							</div>
						</fieldset>

						<fieldset>
							<legend>Note Tracking (DTW)</legend>

							<div class="form-grid">
								<label for="query-capacity">Query Capacity</label>
								<input 
									type="number"
									id="query-capacity"
									name="queryCapacity"
									value="50"
									min="1"
									step="1"
								>

								<label for="accept-threshold">Accept Threshold</label>
								<input 
									type="number"
									id="accept-threshold"
									name="acceptThreshold"
									value="1.5"
									min="0"
									step="0.1"
								>

								<label for="track-threshold">Track Threshold</label>
								<input 
									type="number"
									id="track-threshold"
									name="trackThreshold"
									value="0.9"
									min="0"
									step="0.1"
								>

								<label for="slack">Slack</label>
								<input 
									type="number"
									id="slack"
									name="slack"
									value="2"
									min="0"
									step="1"
								>

								<label for="recover-after">Recover After</label>
								<input 
									type="number"
									id="recover-after"
									name="recoverAfter"
									value="5"
									min="1"
									step="1"
								>
							</div>
						</fieldset>

						<div class="form-actions">
							<button type="reset" id="reset-config-button">
								Reset Configuration
							</button>
						</div>

					</form>
				</section>

				<section class="panel tests-panel">
					<h2>Tests</h2>

					<div class="test-actions">
						<button type="button" id="run-all-button">
							Run All Tests
						</button>

						<button type="button" id="load-test-button">
							Load JSON
						</button>

						<input
							type="file"
							id="test-file-input"
							accept=".json,application/json"
							hidden
						>
					</div>

					<div class="test-options">
						<label for="use-current-config">
							<input
								type="checkbox"
								id="use-current-config"
								checked
							>
							Override test configuration with current settings
						</label>
					</div>

					<div id="tests-list" class="tests-list">
						<p class="empty-state">
							No tests loaded.
						</p>
					</div>
				</section>

				<section class="panel results-panel">
					<div class="panel-header">
						<h2>Results</h2>

						<button type="button" id="clear-results-button">
							Clear Results
						</button>
					</div>

					<div id="results-summary" class="results-summary">
						<div class="stat">
							<span class="stat-label">Total</span>
							<span id="total-tests">0</span>
						</div>

						<div class="stat">
							<span class="stat-label">Passed</span>
							<span id="passed-tests">0</span>
						</div>

						<div class="stat">
							<span class="stat-label">Failed</span>
							<span id="failed-tests">0</span>
						</div>

						<div class="stat">
							<span class="stat-label">Errors</span>
							<span id="error-tests">0</span>
						</div>

						<div class="stat">
							<span class="stat-label">Duration</span>
							<span id="tests-duration">0 ms</span>
						</div>
					</div>

					<div id="results-list" class="results-list">
						<p class="empty-state">
							Run a test to see results.
						</p>
					</div>
				</section>

				<section class="panel logs-panel">
					<div class="panel-header">
						<h2>Debug Logs</h2>

						<div class="log-actions">
							<label for="enable-debug-logs">
								<input 
									type="checkbox"
									id="enable-debug-logs"
								>
								Enable Debug Logs
							</label>

							<button type="button" id="download-logs-button">
								Download Logs
							</button>

							<button type="button" id="clear-logs-button">
								Clear
							</button>
						</div>
					</div>

					<pre id="debug-output" class="debug-output"></pre>
				</section>
			</main>
		</div>
	</body>
</html>
